name: Publish RankBoard NeoForge

run-name: Publish RankBoard NeoForge ${{ github.event.release.tag_name || inputs.tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub Release tag
        required: true
        type: string
      destinations:
        description: External publication targets
        required: false
        type: choice
        default: all
        options:
          - all
          - modrinth
          - curseforge
      versions:
        description: NeoForge targets to rebuild (comma-separated or all)
        required: false
        type: string
        default: all

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-neoforge-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect published Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      version_type: ${{ steps.metadata.outputs.version_type }}
      destinations: ${{ steps.metadata.outputs.destinations }}
      versions: ${{ steps.metadata.outputs.versions }}
    steps:
      - name: Resolve Release metadata
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DESTINATIONS: ${{ inputs.destinations }}
          INPUT_VERSIONS: ${{ inputs.versions }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          destinations="$INPUT_DESTINATIONS"
          versions="$INPUT_VERSIONS"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            destinations="all"
            versions="all"
          fi
          if [[ -z "$tag" ]]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          destinations="${destinations:-all}"
          versions="${versions:-all}"
          versions="${versions// /}"

          version="$tag"
          version="${version#release-}"
          version="${version#neoforge-}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Could not derive a semantic version from tag '$tag'." >&2
            exit 1
          fi

          prerelease="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
          version_type="release"
          if [[ "$prerelease" == "true" ]]; then
            version_type="beta"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "version_type=$version_type"
            echo "destinations=$destinations"
            echo "versions=$versions"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build NeoForge ${{ matrix.target }}
    needs: inspect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: 1.21.1
            minecraft: 1.21.1
            neo_version: 21.1.241
            java: '21'
          - target: 1.21.4
            minecraft: 1.21.4
            neo_version: 21.4.157
            java: '21'
          - target: 1.21.8
            minecraft: 1.21.8
            neo_version: 21.8.54
            java: '21'
          - target: 1.21.11
            minecraft: 1.21.11
            neo_version: 21.11.44
            java: '21'
          - target: 26.1
            minecraft: 26.1
            neo_version: 26.1.0.19-beta
            java: '25'
          - target: 26.1.1
            minecraft: 26.1.1
            neo_version: 26.1.1.15-beta
            java: '25'
          - target: 26.1.2
            minecraft: 26.1.2
            neo_version: 26.1.2.94
            java: '25'
          - target: 26.2
            minecraft: 26.2
            neo_version: 26.2.0.41-beta
            java: '25'
    steps:
      - name: Check out Release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.tag }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge artifact
        if: ${{ needs.inspect.outputs.versions == 'all' || contains(format(',{0},', needs.inspect.outputs.versions), format(',{0},', matrix.target)) }}
        shell: bash
        env:
          VERSION: ${{ needs.inspect.outputs.version }}
          MINECRAFT: ${{ matrix.minecraft }}
          NEO_VERSION: ${{ matrix.neo_version }}
          TARGET: ${{ matrix.target }}
        run: |
          ./gradlew -p neoforge clean build --no-daemon --console=plain \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Pminecraft_version="$MINECRAFT" \
            -Pneo_version="$NEO_VERSION" \
            -Pmod_version="$VERSION"
          mkdir -p release
          artifact="$(find neoforge/build/libs -maxdepth 1 -type f -name 'rankboard-*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$artifact"
          output="release/rankboard-${VERSION}+neoforge+mc${TARGET}.jar"
          mv "$artifact" "$output"
          checksum="${output%.jar}.sha256"
          sha256sum "$output" > "$checksum"

      - name: Upload NeoForge build artifact
        if: ${{ needs.inspect.outputs.versions == 'all' || contains(format(',{0},', needs.inspect.outputs.versions), format(',{0},', matrix.target)) }}
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-${{ matrix.target }}
          path: release
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish NeoForge ${{ matrix.target }}
    needs: [inspect, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: 1.21.1
            game_version: 1.21.1
          - target: 1.21.4
            game_version: 1.21.4
          - target: 1.21.8
            game_version: 1.21.8
          - target: 1.21.11
            game_version: 1.21.11
          - target: 26.1
            game_version: 26.1
          - target: 26.1.1
            game_version: 26.1.1
          - target: 26.1.2
            game_version: 26.1.2
          - target: 26.2
            game_version: 26.2
    steps:
      - name: Download NeoForge build artifact
        if: ${{ needs.inspect.outputs.versions == 'all' || contains(format(',{0},', needs.inspect.outputs.versions), format(',{0},', matrix.target)) }}
        uses: actions/download-artifact@v4
        with:
          name: neoforge-${{ matrix.target }}
          path: release

      - name: Upload NeoForge assets to GitHub Release
        if: ${{ needs.inspect.outputs.versions == 'all' || contains(format(',{0},', needs.inspect.outputs.versions), format(',{0},', matrix.target)) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.inspect.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.jar release/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish NeoForge to Modrinth
        if: ${{ (needs.inspect.outputs.versions == 'all' || contains(format(',{0},', needs.inspect.outputs.versions), format(',{0},', matrix.target))) && (needs.inspect.outputs.destinations == 'all' || needs.inspect.outputs.destinations == 'modrinth') }}
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/*.jar
          name: RankBoard ${{ needs.inspect.outputs.version }} NeoForge ${{ matrix.target }}
          version: ${{ needs.inspect.outputs.version }}
          version-type: ${{ needs.inspect.outputs.version_type }}
          loaders: neoforge
          game-versions: ${{ matrix.game_version }}
          environment: server
          changelog: |
            完善多语言
          modrinth-id: ${{ vars.MODRINTH_NEOFORGE_PROJECT_ID || vars.MODRINTH_PROJECT_ID || 'TcDzE8EJ' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          retry-attempts: 3
          retry-delay: 15000

      - name: Publish NeoForge to CurseForge
        if: ${{ (needs.inspect.outputs.versions == 'all' || contains(format(',{0},', needs.inspect.outputs.versions), format(',{0},', matrix.target))) && (needs.inspect.outputs.destinations == 'all' || needs.inspect.outputs.destinations == 'curseforge') }}
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/*.jar
          name: RankBoard ${{ needs.inspect.outputs.version }} NeoForge ${{ matrix.target }}
          version: ${{ needs.inspect.outputs.version }}
          version-type: ${{ needs.inspect.outputs.version_type }}
          loaders: neoforge
          game-versions: ${{ matrix.game_version }}
          environment: server
          changelog: |
            完善多语言
          curseforge-id: ${{ vars.CURSEFORGE_NEOFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID || '1663124' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          retry-attempts: 3
          retry-delay: 15000
